[[bin]]
name = "speak_check"
required-features = ["speak"]

# Gate for the zero-copy talker lane: weights bit-identity + teacher-forced
# forward bit-exactness across raw-fold/folded-alias (the fused talker lane
# was removed 2026-07-12 — raw is the ONLY talker lane).
[[bin]]
name = "qwen3tts_raw_gate"
required-features = ["speak"]

# The nomic-embed-multimodal-7b (BiQwen2_5 / qwen2_5_vl) parity tests all ride
