[dev-dependencies]
burn-ndarray = "0.21.0"

[patch.crates-io]

# burn, forked for a matmul defect: launch_matmul bound the non-quantized
# rhs with the LHS dtype, so mixed-dtype matmul silently returned about half
# the correct value (f32 x BF16) or NaN (BF16 x f32). See
# ../burn-fork branch fix/matmul-rhs-dtype. All members are patched together
# because the burn workspace uses path+version deps: patching a subset yields
# two copies of burn-tensor in one binary.
burn = { path = "../burn-fork/crates/burn" }
burn-autodiff = { path = "../burn-fork/crates/burn-autodiff" }
burn-backend = { path = "../burn-fork/crates/burn-backend" }
burn-core = { path = "../burn-fork/crates/burn-core" }
burn-cubecl = { path = "../burn-fork/crates/burn-cubecl" }
burn-cubecl-fusion = { path = "../burn-fork/crates/burn-cubecl-fusion" }
burn-cuda = { path = "../burn-fork/crates/burn-cuda" }
burn-dataset = { path = "../burn-fork/crates/burn-dataset" }
burn-derive = { path = "../burn-fork/crates/burn-derive" }
burn-dispatch = { path = "../burn-fork/crates/burn-dispatch" }
burn-flex = { path = "../burn-fork/crates/burn-flex" }
burn-fusion = { path = "../burn-fork/crates/burn-fusion" }
burn-ir = { path = "../burn-fork/crates/burn-ir" }
burn-ndarray = { path = "../burn-fork/crates/burn-ndarray" }
burn-nn = { path = "../burn-fork/crates/burn-nn" }
burn-optim = { path = "../burn-fork/crates/burn-optim" }
burn-rl = { path = "../burn-fork/crates/burn-rl" }
burn-std = { path = "../burn-fork/crates/burn-std" }
burn-tensor = { path = "../burn-fork/crates/burn-tensor" }
burn-train = { path = "../burn-fork/crates/burn-train" }
burn-vision = { path = "../burn-fork/crates/burn-vision" }
burn-wgpu = { path = "../burn-fork/crates/burn-wgpu" }
# Forked to add a zero-copy "register an externally-created GPU buffer as a
# tensor handle" seam (mmap'd f16 pile pages -> Metal newBufferWithBytesNoCopy ->
# wgpu buffer -> cubecl handle). Unmodified baseline first; patched below.
cubecl-runtime = { path = "../cubecl-fork/cubecl-runtime" }
cubecl-cuda = { path = "../cubecl-fork/cubecl-cuda" }
cubecl-wgpu = { path = "../cubecl-fork/cubecl-wgpu" }
# Local triblespace-core: V3 uniform 256-byte headers — every record 256-aligned,
# so mmap'd blobs sit at GPU-ready offsets for zero-copy aliasing (cat-merge safe).
triblespace-core = { path = "../triblespace-rs/triblespace-core" }

