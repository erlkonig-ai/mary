[[test]]
name = "formats_import"
required-features = ["import"]

# The STT lane, live: file-paced streaming transcription + (morning) mic mode.
[[bin]]
name = "voxtral_listen"
required-features = ["voxtral"]

# Kimi K3: the `situ` activation against oracle vectors captured from the
# shipped `SituAndMul`. CPU lane only under `k3`; add `k3-cuda` for
# the GPU lane as well.
[[bin]]
name = "kimi_situ_gate"
required-features = ["k3"]

# MXFP4 decode + MXFP4 -> NVFP4 transcode gate: bit-exactness against the
# k3oracle reference decode of real Kimi-K3 expert bytes.
# The latent MoE block against the whole-layer oracle: the router, the latent
# bottleneck, one expert in isolation, the 16-of-896 combination over the real
# expert set, and the shared experts. Reads the checkpoint directly (safetensors
# headers are parsed in the gate, so no `import` feature) and decodes the routed
# experts with mary::nn::mxfp4, hence `mxfp4`; `k3` supplies the config.
[[bin]]
name = "k3_moe_gate"
required-features = ["k3"]

# The whole-layer gate: one Kimi-K3 decoder layer composed out of the ported
# primitives, held to the whole-layer oracle at every sub-block boundary. Reads
# the checkpoint shards directly (safetensors + mmap) and the oracle .npz, so it
# needs the k3 feature in full.
[[bin]]
name = "k3_layer_gate"
required-features = ["k3"]

[[bin]]
name = "mxfp4_gate"
required-features = ["mxfp4"]

# How far the bit-exact transcode reaches: sweep the E8M0 exponent span of a
# checkpoint's scale planes (reads scales only, never a weight byte).
[[bin]]
name = "mxfp4_span_sweep"
required-features = ["mxfp4"]

# Which block-scaled FP4 tensor-core shapes THIS GPU reports (MXFP4 ue8m0
# scale_vec::2X vs NVFP4 e4m3 scale_vec::4X) — the transcode's target, asked
# rather than assumed.
[[bin]]
name = "mxfp4_mma_probe"
required-features = ["mxfp4", "cuda-backend"]

[[bin]]
name = "mxmma_probe"
required-features = ["mxfp4", "cuda-backend"]

[[bin]]
name = "k3_expert_index"
required-features = ["k3"]
[[bin]]
